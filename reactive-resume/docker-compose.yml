services:
  database:
    container_name: reactive-resume-database
    labels:
      kuma.reactive-resume-database.docker.name: "reactive-resume-database"
      kuma.reactive-resume-database.docker.docker_host_name: local-docker-host
      kuma.reactive-resume-database.docker.docker_container: reactive-resume-database
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-reactive_resume}"
      POSTGRES_USER: "${POSTGRES_USER:-reactive_resume}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-reactive_resume} -d ${POSTGRES_DB:-reactive_resume}"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  reactive-resume:
    container_name: reactive-resume
    image: amruthpillai/reactive-resume:${REACTIVE_RESUME_VERSION:-latest}
    restart: unless-stopped
    environment:
      APP_URL: "https://resume.${DOMAIN:?Set DOMAIN in .env}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-reactive_resume}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-reactive_resume}"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env}"
      TZ: "${TZ:-Etc/UTC}"
      FLAG_DISABLE_SIGNUPS: "${FLAG_DISABLE_SIGNUPS:-false}"
    volumes:
      - ./data:/app/data
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - webgateway
    labels:
      kuma.reactive-resume.docker.name: "reactive-resume"
      kuma.reactive-resume.docker.docker_host_name: local-docker-host
      kuma.reactive-resume.docker.docker_container: reactive-resume
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.reactive-resume.rule: "Host(`resume.${DOMAIN}`)"
      traefik.http.routers.reactive-resume.entrypoints: websecure
      traefik.http.routers.reactive-resume.tls.certresolver: myresolver
      traefik.http.services.reactive-resume.loadbalancer.server.port: "3000"
      homepage.group: Productivity
      homepage.name: Reactive Resume
      homepage.icon: reactive-resume
      homepage.href: "https://resume.${DOMAIN}"
      homepage.description: Private resume builder and PDF exporter.

networks:
  backend:
    internal: true
  webgateway:
    external: true
    name: webgateway
