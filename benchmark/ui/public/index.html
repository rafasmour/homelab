<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Benchmarks</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="appbar">
    <div class="wrap appbar-in">
      <a class="brand" href="?" data-nav="home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="bm-bg" width="32" height="32" rx="8"/><rect class="bm-1" x="7" y="17" width="4.5" height="8" rx="1.2"/><rect class="bm-2" x="13.75" y="11" width="4.5" height="14" rx="1.2"/><rect class="bm-3" x="20.5" y="7" width="4.5" height="18" rx="1.2"/></svg>
        <span class="brand-name">Benchmarks</span>
      </a>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="appbar-actions">
        <button class="toggle" id="theme" type="button" role="switch" aria-label="Dark mode">
          <svg class="i t-ico t-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i t-ico t-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span class="knob"></span>
        </button>
        <form method="post" action="/logout" class="logout"><button class="btn btn-ghost" type="submit">Sign out</button></form>
      </div>
    </div>
  </header>

  <section class="filterbar" id="filters" aria-label="Filters">
    <div class="wrap">
      <div class="filter-row">
        <div id="f-benchmark"></div>
        <div id="f-runs"></div>
        <span class="filter-sep" aria-hidden="true"></span>
        <div id="f-models"></div>
        <div id="f-cases"></div>
        <div id="f-profiles"></div>
        <div id="f-kinds"></div>
        <div id="f-status"></div>
        <div id="f-checks"></div>
        <div id="f-ranges"></div>
        <button type="button" class="btn ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Filters</span><span class="dd-count" id="ftoggle-n" hidden></span></button>
        <label class="search">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="sr-only">Search</span>
          <input class="input" id="f-q" type="search" placeholder="Search model, case, answer, error" autocomplete="off">
        </label>
      </div>
      <div class="chip-row">
        <div class="chips" id="chips" aria-label="Active filters"></div>
        <div class="chip-actions">
          <span id="summary" aria-live="polite"></span>
          <button type="button" id="reset" class="btn btn-ghost btn-sm">Clear all</button>
          <button type="button" id="copy" class="btn btn-sm">Copy link</button>
        </div>
      </div>
    </div>
  </section>

  <main id="main" class="wrap main" tabindex="-1"><div class="card empty"><span class="spinner"></span>Loading results…</div></main>
  <div id="defs" class="sr-only"></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
</body>
</html>
