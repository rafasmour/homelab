services:
  database:
    container_name: firefly-iii-database
    labels:
      kuma.firefly-iii-database.docker.name: "firefly-iii-database"
      kuma.firefly-iii-database.docker.docker_host_name: local-docker-host
      kuma.firefly-iii-database.docker.docker_container: firefly-iii-database
    image: mariadb:${MARIADB_VERSION:-lts}
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "${DB_DATABASE:-firefly}"
      MYSQL_USER: "${DB_USERNAME:-firefly}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - ./database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  firefly-iii:
    container_name: firefly-iii
    image: fireflyiii/core:${FIREFLY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      APP_URL: "https://firefly.${DOMAIN:?Set DOMAIN in .env}"
      FIREFLY_III_LAYOUT: "${FIREFLY_III_LAYOUT:-v2}"
      SITE_OWNER: "${SITE_OWNER:?Set SITE_OWNER in .env}"
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-firefly}"
      DB_USERNAME: "${DB_USERNAME:-firefly}"
      DB_PASSWORD: "${DB_PASSWORD}"
      TZ: "${TZ:-Etc/UTC}"
      STATIC_CRON_TOKEN: "${STATIC_CRON_TOKEN:?Set a 32-character STATIC_CRON_TOKEN in .env}"
    volumes:
      - ./uploads:/var/www/html/storage/upload
    networks:
      - backend
      - webgateway
    labels:
      kuma.firefly-iii.docker.name: "firefly-iii"
      kuma.firefly-iii.docker.docker_host_name: local-docker-host
      kuma.firefly-iii.docker.docker_container: firefly-iii
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.firefly.rule: "Host(`firefly.${DOMAIN}`)"
      traefik.http.routers.firefly.entrypoints: websecure
      traefik.http.routers.firefly.tls.certresolver: myresolver
      traefik.http.services.firefly.loadbalancer.server.port: "8080"
      homepage.group: Finance
      homepage.name: Firefly III
      homepage.icon: firefly-iii
      homepage.href: "https://firefly.${DOMAIN}"
      homepage.description: Personal finance and budget manager.

  data-importer:
    container_name: firefly-iii-data-importer
    image: fireflyiii/data-importer:${DATA_IMPORTER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - firefly-iii
    environment:
      FIREFLY_III_URL: "http://firefly-iii:8080"
      VANITY_URL: "https://firefly.${DOMAIN:?Set DOMAIN in .env}"
      FIREFLY_III_CLIENT_ID: "${FIREFLY_III_CLIENT_ID:-}"
      FIREFLY_III_ACCESS_TOKEN: "${FIREFLY_III_ACCESS_TOKEN:-}"
      TRUSTED_PROXIES: "*"
      TZ: "${TZ:-Etc/UTC}"
      CAN_POST_AUTOIMPORT: "true"
      IMPORT_DIR_ALLOWLIST: /import
      FALLBACK_IN_DIR: "true"
      AUTO_IMPORT_SECRET: "${AUTO_IMPORT_SECRET:-}"
    volumes:
      - ./imports:/import
    networks:
      - backend
      - webgateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.firefly-importer.rule: "Host(`firefly-importer.${DOMAIN:?Set DOMAIN in .env}`)"
      traefik.http.routers.firefly-importer.entrypoints: websecure
      traefik.http.routers.firefly-importer.tls.certresolver: myresolver
      traefik.http.services.firefly-importer.loadbalancer.server.port: "8080"
      homepage.group: Finance
      homepage.name: Firefly III Data Importer
      homepage.icon: firefly-iii
      homepage.href: "https://firefly-importer.${DOMAIN}"
      homepage.description: Import bank statements and transaction files.

  cron:
    container_name: firefly-iii-cron
    labels:
      kuma.firefly-iii-cron.docker.name: "firefly-iii-cron"
      kuma.firefly-iii-cron.docker.docker_host_name: local-docker-host
      kuma.firefly-iii-cron.docker.docker_container: firefly-iii-cron
    image: alpine:${ALPINE_VERSION:-3.22}
    restart: unless-stopped
    depends_on:
      - firefly-iii
    environment:
      TZ: "${TZ:-Etc/UTC}"
      STATIC_CRON_TOKEN: "${STATIC_CRON_TOKEN}"
    command:
      - /bin/sh
      - -c
      - >-
        echo "0 3 * * * wget -qO- http://firefly-iii:8080/api/v1/cron/$$STATIC_CRON_TOKEN; echo"
        | crontab - &&
        crond -f -L /dev/stdout
    networks:
      - backend

networks:
  backend:
    internal: true
  webgateway:
    external: true
    name: webgateway
