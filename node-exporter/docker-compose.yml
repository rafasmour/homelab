services:
  node-exporter:
    container_name: node-exporter
    labels:
      kuma.node-exporter.docker.name: "node-exporter"
      kuma.node-exporter.docker.docker_host_name: local-docker-host
      kuma.node-exporter.docker.docker_container: node-exporter
    image: quay.io/prometheus/node-exporter:v1.11.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      # Prometheus textfile metrics written by host scripts (runtime data, ignored).
      - ./textfile:/textfile:ro
    networks:
      - webgateway

networks:
  webgateway:
    external: true
    name: webgateway
