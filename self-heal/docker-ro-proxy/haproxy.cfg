# Read-only Docker API for self-heal-diagnose-mcp. Everything not allowed
# below is answered with 403.
#   allowed: GET/HEAD /_ping, /version, /containers/json (the list),
#            /containers/<allowed>/logs
#   denied:  every write, exec, inspect (/containers/<id>/json exposes the
#            environment), images, volumes, networks, info, events, ...
# DIAG_LOG_CONTAINERS is a regex alternation of container names.
global
  log stdout format raw local0 info
  maxconn 100

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout http-request 10s

frontend docker
  bind :2375
  http-request deny deny_status 403 unless { method GET HEAD }

  acl ping     path_reg ^(/v[0-9.]+)?/_ping$
  acl version  path_reg ^(/v[0-9.]+)?/version$
  acl list     path_reg ^(/v[0-9.]+)?/containers/json$
  acl logs     path_reg '^(/v[0-9.]+)?/containers/('"${DIAG_LOG_CONTAINERS}"')/logs$'

  http-request allow if ping
  http-request allow if version
  http-request allow if list
  http-request allow if logs
  http-request deny deny_status 403

  default_backend dockerd

backend dockerd
  server dockerd /var/run/docker.sock
