# Docker API proxy for the self-heal controller: restart-only access.
# Everything not allowed below is answered with 403.
#   allowed: GET /_ping (health check),
#            POST /containers/<allowed>/restart (no query string)
#   denied:  everything else: list, inspect, logs, create/run, start, stop,
#            kill, rm, exec, images, volumes, networks, build, events.
# SELF_HEAL_RESTART_ALLOWLIST is a regex alternation of container names. It is
# enforced here independently of the controller, so a compromised controller
# can still only restart these containers.
global
  log stdout format raw local0 info
  maxconn 50

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 2m
  timeout server 2m

frontend docker
  bind :2375

  # A container name segment: no slashes, no dot segments, no encoding.
  acl ping      path_reg ^(/v[0-9.]+)?/_ping$
  acl name_ok   path_reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/restart$
  acl allowed   path_reg '^(/v[0-9.]+)?/containers/('"${SELF_HEAL_RESTART_ALLOWLIST}"')/restart$'
  acl has_query query -m found

  http-request allow if { method GET HEAD } ping
  http-request allow if { method POST } name_ok allowed !has_query
  http-request deny deny_status 403

  default_backend dockerd

backend dockerd
  server dockerd /var/run/docker.sock
