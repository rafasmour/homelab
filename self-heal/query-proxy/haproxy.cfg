# Read-only Prometheus/Loki query API for self-heal-diagnose-mcp. Only GET
# on the query and label endpoints is forwarded; admin, delete, push,
# rules, alerts, status, config and everything else is answered with 403.
# Backends are resolved through Docker DNS at runtime, so this proxy starts
# (and recovers) even when prometheus or loki is down.
global
  log stdout format raw local0 info
  maxconn 100

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 60s
  timeout server 45s
  timeout http-request 10s
  default-server init-addr none resolvers docker

resolvers docker
  nameserver dockerdns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s
  hold nx 5s
  hold other 5s
  hold refused 5s
  hold timeout 5s
  hold obsolete 10s

frontend query
  bind :8080
  http-request deny deny_status 403 unless { method GET }

  acl prom path_reg ^/api/v1/(query|query_range|labels|series)$
  acl prom path_reg ^/api/v1/label/[a-zA-Z_][a-zA-Z0-9_]*/values$
  acl loki path_reg ^/loki/api/v1/(query|query_range|labels)$
  acl loki path_reg ^/loki/api/v1/label/[a-zA-Z_][a-zA-Z0-9_.]*/values$

  # Never forward client credentials or cookies to the backends.
  http-request del-header Authorization
  http-request del-header Cookie

  http-request deny deny_status 403 if !prom !loki

  use_backend prometheus if prom
  use_backend loki if loki

backend prometheus
  server prometheus prometheus:9090

backend loki
  server loki loki:3100
