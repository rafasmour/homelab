# Egress relay for Hindsight. Hindsight itself sits on the internal (no
# internet) `hindsight` network; this container also joins webgateway and
# forwards two fixed ports to two fixed upstreams, nothing else.
#   :8001 -> llama-server:8080      (GPU router, retain/reflect LLM)
#   :8002 -> llama-classifier:8080  (CPU router, EmbeddingGemma 2 embeddings)
# Docker DNS is resolved per request so this container starts even while
# a llama container is down.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 8001;
    client_max_body_size 32m;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
    location / {
        set $upstream http://llama-server:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 8002;
    client_max_body_size 32m;
    proxy_read_timeout 300s;
    location / {
        set $upstream http://llama-classifier:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
