services:
  n8n:
    container_name: n8n
    build:
      context: .
      dockerfile: Dockerfile
      args:
        N8N_VERSION: ${N8N_VERSION:-latest}
    image: n8n-homelab:${N8N_VERSION:-latest}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "${POSTGRES_DB:-n8n}"
      DB_POSTGRESDB_USER: "${POSTGRES_USER:-n8n}"
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      N8N_HOST: "n8n.${DOMAIN:?Set DOMAIN in .env}"
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_PROXY_HOPS: "1"
      N8N_EDITOR_BASE_URL: "https://n8n.${DOMAIN}"
      WEBHOOK_URL: "https://n8n.${DOMAIN}/"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}"
      GENERIC_TIMEZONE: "${TZ:-Europe/Athens}"
      TZ: "${TZ:-Europe/Athens}"
      NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
      N8N_RESTRICT_FILE_ACCESS_TO: /tmp;~/.n8n-files
      # Privacy: no usage telemetry, onboarding survey or cloud AI (version checks and templates stay on).
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_AI_ENABLED: "false"
    volumes:
      - ./data:/home/node/.n8n
    networks:
      - backend
      - hermes-mcp
      - webgateway
      - databases
    labels:
      kuma.n8n.docker.name: "n8n"
      kuma.n8n.docker.docker_host_name: local-docker-host
      kuma.n8n.docker.docker_container: n8n
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.n8n.rule: "Host(`n8n.${DOMAIN}`)"
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.tls.certresolver: myresolver
      traefik.http.services.n8n.loadbalancer.server.port: "5678"
      homepage.group: Automation
      homepage.name: n8n
      homepage.icon: n8n
      homepage.href: "https://n8n.${DOMAIN}"
      homepage.description: Workflow automation and integration platform.

  mcp:
    container_name: n8n-mcp
    image: ghcr.io/czlonkowski/n8n-mcp:${N8N_MCP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_MODE: "true"
      MCP_MODE: http
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
      # Privacy: n8n-mcp anonymous telemetry off.
      N8N_MCP_TELEMETRY_DISABLED: "true"
      TELEMETRY_DISABLED: "true"
      N8N_API_URL: http://n8n:5678
      N8N_API_KEY: "${N8N_API_KEY:?Set N8N_API_KEY in .env}"
      AUTH_TOKEN: "${N8N_MCP_AUTH_TOKEN:?Set N8N_MCP_AUTH_TOKEN in .env}"
      MCP_AUTH_TOKEN: "${N8N_MCP_AUTH_TOKEN}"
      WEBHOOK_SECURITY_MODE: permissive
    labels:
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.n8n-mcp.rule: "Host(`n8n-mcp.${DOMAIN:?Set DOMAIN in .env}`)"
      traefik.http.routers.n8n-mcp.entrypoints: websecure
      traefik.http.routers.n8n-mcp.tls.certresolver: myresolver
      traefik.http.services.n8n-mcp.loadbalancer.server.port: "3000"
    networks:
      - backend
      - hermes-mcp
      - webgateway
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS -H "Authorization: Bearer $$AUTH_TOKEN" http://localhost:3000/health >/dev/null'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  databases:
    external: true
    name: databases
  backend:
    internal: true
  hermes-mcp:
    external: true
    name: hermes-mcp
  webgateway:
    external: true
    name: webgateway
