services:
  database:
    container_name: n8n-database
    labels:
      kuma.n8n-database.docker.name: "n8n-database"
      kuma.n8n-database.docker.docker_host_name: local-docker-host
      kuma.n8n-database.docker.docker_container: n8n-database
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-n8n}"
      POSTGRES_USER: "${POSTGRES_USER:-n8n}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: database
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "${POSTGRES_DB:-n8n}"
      DB_POSTGRESDB_USER: "${POSTGRES_USER:-n8n}"
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      N8N_HOST: "n8n.${DOMAIN:?Set DOMAIN in .env}"
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_PROXY_HOPS: "1"
      N8N_EDITOR_BASE_URL: "https://n8n.${DOMAIN}"
      WEBHOOK_URL: "https://n8n.${DOMAIN}/"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}"
      GENERIC_TIMEZONE: "${TZ:-Etc/UTC}"
      TZ: "${TZ:-Etc/UTC}"
      PIRAEUS_ZIP_PASSWORD: "${PIRAEUS_ZIP_PASSWORD:-}"
      AUTO_IMPORT_SECRET: "${AUTO_IMPORT_SECRET:-}"
      FIREFLY_IMPORT_DIR: /firefly-import
      FIREFLY_IMPORT_ARCHIVE: /firefly-import-archive
      NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
      N8N_RESTRICT_FILE_ACCESS_TO: /tmp;~/.n8n-files
    volumes:
      - ./data:/home/node/.n8n
      - ./scripts/piraeus-import.cjs:/scripts/piraeus-import.cjs:ro
      - ../firefly-iii/imports:/firefly-import
      - ../firefly-iii/import-archive:/firefly-import-archive
    networks:
      - backend
      - webgateway
    labels:
      kuma.n8n.docker.name: "n8n"
      kuma.n8n.docker.docker_host_name: local-docker-host
      kuma.n8n.docker.docker_container: n8n
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.n8n.rule: "Host(`n8n.${DOMAIN}`)"
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.tls.certresolver: myresolver
      traefik.http.services.n8n.loadbalancer.server.port: "5678"
      homepage.group: Automation
      homepage.name: n8n
      homepage.icon: n8n
      homepage.href: "https://n8n.${DOMAIN}"
      homepage.description: Workflow automation and integration platform.

  mcp:
    container_name: n8n-mcp
    image: ghcr.io/czlonkowski/n8n-mcp:${N8N_MCP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_MODE: "true"
      MCP_MODE: http
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
      N8N_API_URL: http://n8n:5678
      N8N_API_KEY: "${N8N_API_KEY:?Set N8N_API_KEY in .env}"
      AUTH_TOKEN: "${N8N_MCP_AUTH_TOKEN:?Set N8N_MCP_AUTH_TOKEN in .env}"
      MCP_AUTH_TOKEN: "${N8N_MCP_AUTH_TOKEN}"
      WEBHOOK_SECURITY_MODE: permissive
    labels:
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.n8n-mcp.rule: "Host(`n8n-mcp.${DOMAIN:?Set DOMAIN in .env}`)"
      traefik.http.routers.n8n-mcp.entrypoints: websecure
      traefik.http.routers.n8n-mcp.tls.certresolver: myresolver
      traefik.http.services.n8n-mcp.loadbalancer.server.port: "3000"
    networks:
      - backend
      - hermes-mcp
      - webgateway
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS -H "Authorization: Bearer $$AUTH_TOKEN" http://localhost:3000/health >/dev/null'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  backend:
    internal: true
  hermes-mcp:
    external: true
    name: hermes-mcp
  webgateway:
    external: true
    name: webgateway
