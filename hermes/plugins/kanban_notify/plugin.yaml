name: kanban_notify
version: 1.0.0
description: "Post a Nextcloud Talk message when a Kanban worker completes or blocks a card, through the hermes-nextcloud-bridge /deliver endpoint."
author: homelab
provides_hooks:
  - kanban_task_completed
  - kanban_task_blocked
requires_env:
  - name: NEXTCLOUD_TALK_DELIVER_URL
    description: "hermes-nextcloud-bridge /deliver URL"
    prompt: "Bridge /deliver URL"
    password: false
  - name: NEXTCLOUD_TALK_DELIVER_SECRET
    description: "Bearer token accepted by the bridge /deliver endpoint"
    prompt: "Bridge delivery bearer secret"
    password: true
  - name: NEXTCLOUD_TALK_HOME_ROOM
    description: "Talk room token that receives the messages"
    prompt: "Talk home room token"
    password: false
