# nextcloud: Calendars, tasks, notes, files and contacts on the private Nextcloud.
# Layered on _base/config.yaml (shared settings). Only what differs per profile is set here.
# ${VAR} placeholders are expanded by Hermes from the profile's .env (the stack's hermes/.env).

# Config schema version Hermes expects (the file is mounted read-only, so Hermes cannot migrate it; without the
# key it logs a migration warning at every start). Raise it together with the image tag after `hermes config check`.
_config_version: 53

# MCP servers this profile connects to, with per-tool allowlists.
mcp_servers:
  nextcloud:
    url: http://nextcloud-mcp:8000/mcp
    connect_timeout: 60
    timeout: 3600
    enabled: true
    tools:
      resources: false
      prompts: false
      include:
      - nc_calendar_list_calendars
      - nc_calendar_list_events
      - nc_calendar_get_event
      - nc_calendar_get_upcoming_events
      - nc_calendar_list_todos
      - nc_calendar_search_todos
      - nc_calendar_create_event
      - nc_calendar_update_event
      - nc_calendar_delete_event
      - nc_calendar_create_todo
      - nc_calendar_update_todo
      - nc_calendar_complete_todo
      - nc_calendar_delete_todo
      - nc_notes_create_note
      - nc_notes_search_notes
      - nc_notes_get_note
      - nc_notes_append_content
      - nc_notes_update_note
      - nc_webdav_read_file
      - nc_webdav_write_file
      - nc_webdav_list_directory
      - nc_webdav_search_files
      - nc_webdav_find_by_name
      - nc_webdav_move_resource
      - nc_webdav_create_directory
      - nc_webdav_delete_resource
      - nc_contacts_search_contacts
      - nc_contacts_list_addressbooks
      - nc_contacts_create_contact
  web_search:
    url: http://web-search-mcp:8000/mcp
    headers:
      Authorization: Bearer ${WEB_SEARCH_MCP_TOKEN}
    connect_timeout: 60
    timeout: 3600
    enabled: true
    tools:
      resources: false
      prompts: false

# Toolsets: the allowlist of what each platform may use (naming MCP servers makes it an allowlist).
toolsets: &chat
  - nextcloud
  - kanban
  - memory
platform_toolsets:
  cli: *chat
  api_server: *chat
  cron:
    - nextcloud
    - web_search
    - kanban
    - memory

agent:
  # Built-ins that let a small model finish without touching the real target, or that reach outside the
  # MCP surface. kanban is never disabled: a dispatcher-spawned worker needs kanban_complete/kanban_block.
  disabled_toolsets:
    - todo
    - session_search
    - messaging
    - web
    - search
    - browser
    - forage
    - vision
    - video
    - tts
    - stt
    - image_gen
    - video_gen
    - computer_use
    - code_execution
    - skills
    - homeassistant
    - clarify
    - file
    - terminal
    - delegation
    - cronjob

# llama.cpp slot 2 (shared by every profile except ai-assistant, which owns slot 0). Sampling replaces the
# model preset's values (a preset presence-penalty of 1.5 made small models drop repeated tool arguments).
custom_providers:
- name: llama-cpp-nextcloud
  base_url: ${HERMES_INFERENCE_BASE_URL}
  extra_body:
    id_slot: 2
    temperature: 0.6
    presence_penalty: 0.0

# The multiplexer owns the single HTTP listener; a specialist that enables api_server aborts gateway
# startup. Its API is served at /p/<profile>/v1 instead.
platforms:
  api_server:
    enabled: false
gateway:
  enabled: false
