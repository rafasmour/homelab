# Greek GPU price watchlist for the n8n workflow "Hermes digest – gpu-watch"
# (n8n/workflows/hermes-digest-gpu-watch.json), which posts to the gpu-watch
# Talk room at 08:22 Europe/Athens.
#
# n8n mounts this file read-only at /home/node/.n8n-files/gpu-watchlist.yml
# and reads it on every run, so edits apply without a restart. An empty
# products list keeps the workflow silent.
#
# Each product is a name, or a mapping:
#   - name: RTX 5070 Ti      # search string sent to the shops
#     target_price: 800      # optional EUR ceiling; the bullet gets ALERT below it
#
# Shops: plaisio.gr (schema.org offers on its search page). skroutz.gr and
# bestprice.gr sit behind a bot challenge and public.gr / you.gr answer 403,
# so they are not read. Only in-stock graphics cards whose name matches count
# (a 5070 never counts as a 5070 Ti; laptops and desktops are ignored).

products: [
  'RTX 5070 Ti',
  'RTX 5080 Ti',
  'RTX 5090 Ti',
  'RTX 5060 Ti',
  'RX 9070',
  'RX 9060',
]
