services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2025.11.1@sha256:91dc91ddd413bf461c283204558f8f21839851e9824799075a7ceff7c77eea40
    dns:
      - "${UPSTREAM_DNS_1:-1.1.1.1}"
      - "${UPSTREAM_DNS_2:-1.0.0.1}"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      PIHOLE_UID: "${PUID:-1000}"
      PIHOLE_GID: "${PGID:-1000}"
      FTLCONF_webserver_domain: "pihole.${DOMAIN:?Set DOMAIN in .env}"
      FTLCONF_webserver_port: "8080,8443s"
      FTLCONF_dns_listeningMode: 'all'
      FTLCONF_webserver_api_password: "${WEBPASSWORD:?Set WEBPASSWORD in .env}"
      FTLCONF_dhcp_active: 'false'
      FTLCONF_ntp_ipv4_active: 'false'
      FTLCONF_ntp_ipv6_active: 'false'
      FTLCONF_ntp_sync_active: 'false'
      FTLCONF_debug_api: 'false'
    volumes:
      - './etc-pihole:/etc/pihole'
    ports:
      - "${PIHOLE_BIND_IP:?Set PIHOLE_BIND_IP in .env}:53:53/tcp"
      - "${PIHOLE_BIND_IP:?Set PIHOLE_BIND_IP in .env}:53:53/udp"
      - "${PIHOLE_WIREGUARD_BIND_IP:?Set PIHOLE_WIREGUARD_BIND_IP in .env}:53:53/tcp"
      - "${PIHOLE_WIREGUARD_BIND_IP:?Set PIHOLE_WIREGUARD_BIND_IP in .env}:53:53/udp"
    cap_add:
      - SYS_NICE
    restart: unless-stopped
    networks:
      - webgateway
    labels:
      kuma.pihole.docker.name: "pihole"
      kuma.pihole.docker.docker_host_name: local-docker-host
      kuma.pihole.docker.docker_container: pihole
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.pihole.rule: "Host(`pihole.${DOMAIN:?Set DOMAIN in .env}`)"
      traefik.http.routers.pihole.entrypoints: websecure
      traefik.http.routers.pihole.tls.certresolver: myresolver
      traefik.http.services.pihole.loadbalancer.server.port: "8080"
      homepage.group: Management
      homepage.name: Pi-hole
      homepage.icon: pi-hole
      homepage.href: "https://pihole.${DOMAIN}"
      homepage.description: DNS sinkhole that protects your devices from unwanted content.
      homepage.widget.type: pihole
      homepage.widget.url: "https://pihole.${DOMAIN}"
      homepage.widget.version: 6
      homepage.widget.key: "${WEBPASSWORD}"

networks:
  webgateway:
    external: true
    name: webgateway
