# Static front end for the maps stack: the web map, its style, fonts, sprites
# and JavaScript, plus the Greece PMTiles archive (served with HTTP range
# requests, which is all MapLibre's pmtiles:// protocol needs). Search and
# routing are routed by Traefik straight to Pelias and Valhalla.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  tcp_nopush on;
  server_tokens off;
  keepalive_timeout 65;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  server {
    listen 8080;
    root /srv/web;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }

    # Vector tiles (one PMTiles file). Range requests are on by default; CORS
    # lets another MapLibre page or QGIS on the VPN reuse the archive.
    location /tiles/ {
      alias /srv/tiles/;
      types { }
      default_type application/vnd.pmtiles;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Headers "Range, If-Match" always;
      add_header Access-Control-Expose-Headers "ETag, Content-Range, Content-Length" always;
      add_header Cache-Control "public, max-age=3600" always;
      if ($request_method = OPTIONS) {
        return 204;
      }
    }

    # Glyph ranges are protobuf files without a recognisable extension type.
    location /assets/fonts/ {
      alias /srv/assets/fonts/;
      types { }
      default_type application/x-protobuf;
      add_header Cache-Control "public, max-age=604800";
    }

    location /assets/ {
      alias /srv/assets/;
      add_header Cache-Control "public, max-age=604800";
    }
  }

  # Empty libpostal stand-in for Pelias (backend network only, no Traefik
  # route). Without a libpostal URL, /v1/search fails with "libpostal service
  # disabled"; an empty parse makes Pelias fall back to its own parser, the
  # same one /v1/autocomplete uses, without running the 2 GB libpostal.
  server {
    listen 4400;

    location = /parse {
      default_type application/json;
      return 200 "[]";
    }

    location / {
      return 404;
    }
  }
}
