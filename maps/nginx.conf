# Empty libpostal stand-in for Pelias (container pelias-libpostal-stub,
# backend network only, no Traefik route). Without a libpostal URL Pelias's
# /v1/search fails with "libpostal service disabled"; an empty parse makes it
# fall back to its own parser, the same one /v1/autocomplete uses, without
# running the 2 GB libpostal service.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 64;
}

http {
  access_log off;
  server_tokens off;

  server {
    listen 4400;

    location = /parse {
      default_type application/json;
      return 200 "[]";
    }

    location / {
      return 404;
    }
  }
}
