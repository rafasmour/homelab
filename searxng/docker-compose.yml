services:
  searxng:
    container_name: searxng
    image: searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "https://searxng.${DOMAIN:?Set DOMAIN in .env}/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}"
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    volumes:
      - ./config:/etc/searxng
      - ./data:/var/cache/searxng
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - backend
      - webgateway
    labels:
      kuma.searxng.docker.name: "searxng"
      kuma.searxng.docker.docker_host_name: local-docker-host
      kuma.searxng.docker.docker_container: searxng
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.searxng.rule: "Host(`searxng.${DOMAIN}`)"
      traefik.http.routers.searxng.entrypoints: websecure
      traefik.http.routers.searxng.tls.certresolver: myresolver
      traefik.http.services.searxng.loadbalancer.server.port: "8080"
      homepage.group: Search
      homepage.name: SearXNG
      homepage.icon: searxng
      homepage.href: "https://searxng.${DOMAIN}"
      homepage.description: Privacy-respecting metasearch engine.

  valkey:
    container_name: searxng-valkey
    labels:
      kuma.searxng-valkey.docker.name: "searxng-valkey"
      kuma.searxng-valkey.docker.docker_host_name: local-docker-host
      kuma.searxng-valkey.docker.docker_container: searxng-valkey
    image: valkey/valkey:${VALKEY_VERSION:-9-alpine}
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - ./valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:
    internal: true
  webgateway:
    external: true
    name: webgateway
