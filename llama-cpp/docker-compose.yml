services:
  llama-cpp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LLAMA_REF: ${LLAMA_REF:-main}
        LLAMA_REPO: ${LLAMA_REPO:-https://github.com/ggml-org/llama.cpp}
        MAX_JOBS: ${MAX_JOBS:-}
    image: llama-cpp-rocm:local
    container_name: llama-server
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "991"
    environment:
      # Required on every request except /health: the router can download
      # (POST /models), delete (DELETE /models) and load models.
      LLAMA_API_KEY: "${LLAMA_API_KEY:?Set LLAMA_API_KEY in .env}"
      # Router downloads (POST /models) persist next to the presets.
      LLAMA_CACHE: /models/cache
    volumes:
      - ./models:/models
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--metrics"
      - "--models-preset"
      - "/models/router-config.ini"
      - "--jinja"
      - "--models-max"
      - "${MAX_MODELS:-1}"
      # Idle sleep is set per preset in router-config.ini ([*] sleep-idle-seconds);
      # a command-line value would override every preset, including the
      # always-warm Hermes model.
    restart: unless-stopped
    networks:
      - webgateway
      # Internal-only network for the Hermes coding sandboxes; reach the router
      # there as http://llama-cpp:8080 (the Compose service name).
      - hermes-llm
    labels:
      - traefik.enable=true
      - traefik.http.routers.llama-server.rule=Host(`ai.${DOMAIN}`)
      - traefik.http.routers.llama-server.entrypoints=websecure
      - traefik.http.routers.llama-server.tls=true
      - "traefik.http.services.llama-server.loadbalancer.server.scheme=http"
      - "traefik.http.services.llama-server.loadbalancer.server.port=8080"
      - homepage.group=AI
      - homepage.name=llama.cpp
      - homepage.icon=mdi-brain
      - homepage.href=https://ai.${DOMAIN}
      - homepage.description=OpenAI-compatible local language model server.

  # One-off access to the other llama.cpp tools (llama-cli, llama-bench,
  # llama-quantize, ...) from the same image, without Traefik labels:
  #   docker compose run --rm llama-tools llama-cli -m /models/<file>.gguf
  llama-tools:
    image: llama-cpp-rocm:local
    pull_policy: never
    profiles:
      - tools
    entrypoint: ["/usr/bin/env"]
    command: ["bash", "-c", "ls /usr/local/bin/llama-*"]
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "991"
    volumes:
      - ./models:/models
    networks:
      - backend

  # Web UI to search Hugging Face for GGUF quants and pull/delete them through
  # the router's model API (POST/GET/DELETE /models, /models/sse). The API key
  # stays server-side; the UI has its own login.
  llama-models-ui:
    build:
      context: ./models-ui
    image: homelab-llama-models-ui:local
    container_name: llama-models-ui
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ:-Europe/Athens}"
      LLAMA_URL: http://llama-server:8080
      LLAMA_API_KEY: "${LLAMA_API_KEY:?Set LLAMA_API_KEY in .env}"
      MODELS_UI_USERNAME: "${MODELS_UI_USERNAME:?Set MODELS_UI_USERNAME in .env}"
      MODELS_UI_PASSWORD: "${MODELS_UI_PASSWORD:?Set MODELS_UI_PASSWORD in .env}"
      HF_TOKEN: "${HF_TOKEN:-}"
    networks:
      - webgateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.llama-models.rule: "Host(`models.${DOMAIN:?Set DOMAIN in .env}`)"
      traefik.http.routers.llama-models.entrypoints: websecure
      traefik.http.routers.llama-models.tls.certresolver: myresolver
      traefik.http.services.llama-models.loadbalancer.server.port: "8080"
      homepage.group: AI
      homepage.name: Model downloads
      homepage.icon: si-huggingface
      homepage.href: "https://models.${DOMAIN}"
      homepage.description: Search Hugging Face for GGUF quants and pull or delete llama.cpp router models.

networks:
  backend:
  # Internal (no internet egress) network shared with the Hermes coding sandboxes.
  hermes-llm:
    name: hermes-llm
    internal: true
  webgateway:
    external: true
    name: webgateway
