# Docker API proxy for sbx-models: restart-only access to the llama.cpp
# containers. Everything not allowed below is answered with 403.
#   allowed: GET /_ping, /version, /info-less list of containers,
#            GET inspect/logs of the allowed containers,
#            POST /containers/<allowed>/restart
#   denied:  create/run, start, stop, kill, rm, exec, images, volumes,
#            networks, build, inspect of any other container (its env).
# RESTART_CONTAINERS is a regex alternation of container names.
global
  log stdout format raw local0 info
  maxconn 200

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 10m
  timeout server 10m

frontend docker
  bind :2375
  http-request deny deny_status 403 unless { method GET HEAD POST }

  acl ping       path_reg ^(/v[0-9.]+)?/_ping$
  acl version    path_reg ^(/v[0-9.]+)?/version$
  acl list       path_reg ^(/v[0-9.]+)?/containers/json$
  acl target_ro  path_reg '^(/v[0-9.]+)?/containers/('"${RESTART_CONTAINERS}"')/(json|logs)$'
  acl target_rs  path_reg '^(/v[0-9.]+)?/containers/('"${RESTART_CONTAINERS}"')/restart$'

  http-request allow if { method GET HEAD } ping
  http-request allow if { method GET HEAD } version
  http-request allow if { method GET HEAD } list
  http-request allow if { method GET HEAD } target_ro
  http-request allow if { method POST } target_rs
  http-request deny deny_status 403

  default_backend dockerd

backend dockerd
  server dockerd /var/run/docker.sock
