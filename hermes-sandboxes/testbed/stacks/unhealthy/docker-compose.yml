# Runs, but its health check always fails. Expected state: running (unhealthy).
services:
  api:
    image: busybox:1.37.0
    restart: unless-stopped
    command: ["sh", "-c", "while true; do echo 'listening on :8080 (not really)'; sleep 30; done"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 2
      start_period: 5s
