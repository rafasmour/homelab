services:
  silverbullet:
    container_name: silverbullet
    image: ghcr.io/silverbulletmd/silverbullet:latest
    restart: unless-stopped
    environment:
      SB_USER: "${SB_USER:?Set SB_USER in .env as username:password}"
    volumes:
      - ./space:/space
    networks:
      - webgateway
    labels:
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.silverbullet.rule: "Host(`silverbullet.${DOMAIN:?Set DOMAIN in .env}`)"
      traefik.http.routers.silverbullet.entrypoints: websecure
      traefik.http.routers.silverbullet.tls.certresolver: myresolver
      traefik.http.services.silverbullet.loadbalancer.server.port: "3000"
      homepage.group: Knowledge
      homepage.name: SilverBullet
      homepage.icon: silverbullet
      homepage.href: "https://silverbullet.${DOMAIN}"
      homepage.description: Local-first personal knowledge platform.

networks:
  webgateway:
    external: true
    name: webgateway

