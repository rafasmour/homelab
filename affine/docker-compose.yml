services:
  postgres:
    container_name: affine-postgres
    labels:
      kuma.affine-postgres.docker.name: "affine-postgres"
      kuma.affine-postgres.docker.docker_host_name: local-docker-host
      kuma.affine-postgres.docker.docker_container: affine-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${AFFINE_DB_NAME:-affine}"
      POSTGRES_USER: "${AFFINE_DB_USER:-affine}"
      POSTGRES_PASSWORD: "${AFFINE_DB_PASSWORD:?Set AFFINE_DB_PASSWORD in .env}"
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${AFFINE_DB_USER:-affine} -d ${AFFINE_DB_NAME:-affine}"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    container_name: affine-redis
    labels:
      kuma.affine-redis.docker.name: "affine-redis"
      kuma.affine-redis.docker.docker_host_name: local-docker-host
      kuma.affine-redis.docker.docker_container: affine-redis
    image: redis:${REDIS_VERSION:-alpine}
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  migration:
    container_name: affine-migration
    labels:
      kuma.affine-migration.docker.name: "affine-migration"
      kuma.affine-migration.docker.docker_host_name: local-docker-host
      kuma.affine-migration.docker.docker_container: affine-migration
    image: ghcr.io/toeverything/affine:${AFFINE_VERSION:-stable}
    restart: "no"
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: "postgresql://${AFFINE_DB_USER:-affine}:${AFFINE_DB_PASSWORD}@postgres:5432/${AFFINE_DB_NAME:-affine}"
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - ./storage:/root/.affine/storage
      - ./config:/root/.affine/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  affine:
    container_name: affine
    image: ghcr.io/toeverything/affine:${AFFINE_VERSION:-stable}
    restart: unless-stopped
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: "postgresql://${AFFINE_DB_USER:-affine}:${AFFINE_DB_PASSWORD}@postgres:5432/${AFFINE_DB_NAME:-affine}"
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - ./storage:/root/.affine/storage
      - ./config:/root/.affine/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - backend
      - webgateway
    labels:
      kuma.affine.docker.name: "affine"
      kuma.affine.docker.docker_host_name: local-docker-host
      kuma.affine.docker.docker_container: affine
      traefik.enable: "true"
      traefik.docker.network: webgateway
      traefik.http.routers.affine.rule: "Host(`affine.${DOMAIN:?Set DOMAIN in .env}`)"
      traefik.http.routers.affine.entrypoints: websecure
      traefik.http.routers.affine.tls.certresolver: myresolver
      traefik.http.services.affine.loadbalancer.server.port: "3010"
      homepage.group: Knowledge
      homepage.name: AFFiNE
      homepage.icon: affine
      homepage.href: "https://affine.${DOMAIN}"
      homepage.description: Collaborative workspace for docs, whiteboards, and databases.

networks:
  backend:
    internal: true
  webgateway:
    external: true
    name: webgateway
